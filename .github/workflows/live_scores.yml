name: Actualizar Marcadores en Vivo

on:
  schedule:
    - cron: '*/15 * * * *' # Cada 15 minutos
  workflow_dispatch: # Permite correrlo manualmente

# Comparte el mismo grupo de concurrencia que el generador diario.
# Si el generador diario está corriendo, este workflow espera.
concurrency:
  group: sportintel-data
  cancel-in-progress: true

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Score Updater
        run: python backend/update_scores.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live scores [skip ci]" && git push)
