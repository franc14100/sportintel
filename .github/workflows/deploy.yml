name: Actualizar Partidos y Desplegar a GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Preparar carpeta frontend/
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'
          
      - name: Desplegar a la Nube (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
